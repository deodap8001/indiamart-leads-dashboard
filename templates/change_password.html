<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password — IndiaMART Lead Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6fa; }
        .pwd-card { border-radius: 14px; border: none; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand mb-0 h1 text-decoration-none" href="/">
            <i class="bi bi-graph-up-arrow"></i> IndiaMART Lead Dashboard
        </a>
        <div>
            <span class="text-light small me-3">
                {% if current_user.is_admin %}
                    <i class="bi bi-person-shield"></i>
                {% else %}
                    <i class="bi bi-person-circle"></i>
                {% endif %}
                {{ current_user.username }}
            </span>
            <a href="/" class="btn btn-sm btn-outline-light me-2">
                <i class="bi bi-arrow-left"></i> Back
            </a>
            <a href="/logout" class="btn btn-sm btn-outline-light">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 500px;">
    <div class="card pwd-card">
        <div class="card-body p-4 p-md-5">
            <h4 class="mb-1">
                <i class="bi bi-shield-lock-fill text-primary"></i> Change Password
            </h4>
            <p class="text-muted small mb-4">
                Changing password for <strong>{{ current_user.username }}</strong>
            </p>

            {% if error %}
            <div class="alert alert-danger py-2 small">
                <i class="bi bi-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success py-2 small">
                <i class="bi bi-check-circle"></i> {{ success }}
            </div>
            {% endif %}

            <form method="post" action="/change-password">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Current Password <span class="text-danger">*</span></label>
                    <input type="password" name="current_password" class="form-control" required autofocus autocomplete="current-password">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">New Password <span class="text-danger">*</span></label>
                    <input type="password" name="new_password" class="form-control" required minlength="6" autocomplete="new-password">
                    <div class="form-text small">Minimum 6 characters.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
                    <input type="password" name="new_password_confirm" class="form-control" required minlength="6" autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold">
                    <i class="bi bi-shield-lock-fill"></i> Update Password
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
