<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — IndiaMART Lead Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border-radius: 14px; border: none; box-shadow: 0 14px 40px rgba(0,0,0,0.18); }
        .login-icon { font-size: 3rem; color: #667eea; }
        .btn-login { background: #667eea; border-color: #667eea; }
        .btn-login:hover { background: #5568d3; border-color: #5568d3; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-graph-up-arrow login-icon"></i>
                        <h4 class="mt-3 mb-1">IndiaMART Dashboard</h4>
                        <p class="text-muted small mb-0">Sign in to continue</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-circle"></i> {{ error }}
                    </div>
                    {% endif %}

                    {% if info %}
                    <div class="alert alert-info py-2 small">
                        <i class="bi bi-info-circle"></i> {{ info }}
                    </div>
                    {% endif %}

                    <form method="post" action="/login">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" required autofocus autocomplete="username" value="{{ username or '' }}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-login text-white w-100 fw-semibold">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </button>
                    </form>

                    {% if first_setup %}
                    <div class="text-center mt-3">
                        <a href="/register" class="small text-decoration-none">
                            First time? Create admin account →
                        </a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
